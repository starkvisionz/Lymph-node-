<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0c2c37"/>
      <stop offset="70%" stop-color="#06141b"/>
      <stop offset="100%" stop-color="#030c11"/>
    </radialGradient>
    <radialGradient id="node" cx="48%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#bff7ec"/>
      <stop offset="45%" stop-color="#37e0c4"/>
      <stop offset="100%" stop-color="#0e6b64"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- full-bleed background (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- vessel network radiating toward the central terminus -->
  <g stroke="#2f8a9c" stroke-width="7" fill="none" opacity="0.6" stroke-linecap="round" filter="url(#glow)">
    <path d="M256 256 L256 120"/>
    <path d="M256 256 L150 180"/>
    <path d="M256 256 L362 180"/>
    <path d="M256 256 L150 350"/>
    <path d="M256 256 L362 350"/>
    <path d="M256 256 L256 400"/>
  </g>

  <!-- satellite nodes -->
  <g fill="#37e0c4" opacity="0.9">
    <circle cx="256" cy="120" r="18"/>
    <circle cx="150" cy="180" r="16"/>
    <circle cx="362" cy="180" r="16"/>
    <circle cx="150" cy="350" r="16"/>
    <circle cx="362" cy="350" r="16"/>
    <circle cx="256" cy="400" r="18"/>
  </g>

  <!-- central node (terminus) -->
  <circle cx="256" cy="256" r="62" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#bff7ec" stroke-opacity="0.6" stroke-width="4"/>
</svg>
